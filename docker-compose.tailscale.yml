# Docker Compose with Tailscale sidecar
# Usage: docker compose -f docker-compose.tailscale.yml up
#
# This runs Hive behind a Tailscale subnet router.
# Anyone on your Tailnet can access Hive at the Tailscale IP.

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: hive-server
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}        # Get from https://login.tailscale.com/settings/keys
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

  hive:
    build: .
    hostname: hive
    network_mode: service:tailscale
    volumes:
      - hive-data:/app/data
      - hive-db:/app/db
    environment:
      - HIVE_HOST=0.0.0.0
      - HIVE_PORT=8000
    depends_on:
      - tailscale
    restart: unless-stopped

volumes:
  tailscale-state:
  hive-data:
  hive-db:
