services:
  hive:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - hive-data:/app/data
      - hive-uploads:/app/uploads
      - hive-memory:/app/hive_memory
      - ./.env:/app/.env:ro
    environment:
      - HIVE_HOST=0.0.0.0
      - HIVE_PORT=8000
      - DEFAULT_PROVIDER=ollama
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  hive-data:
  hive-uploads:
  hive-memory:
  ollama-data:
