name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          pip install chromadb sentence-transformers
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Check syntax
        run: |
          python -m py_compile hive/core/identity.py
          python -m py_compile hive/core/crypto.py
          python -m py_compile hive/core/signal_protocol.py
          python -m py_compile hive/core/p2p_network.py
          python -m py_compile hive/core/agent_peer.py
          python -m py_compile hive/core/relay.py
          python -m py_compile hive/core/db.py
          python -m py_compile hive/core/users.py
          python -m py_compile hive/core/rooms.py
          python -m py_compile hive/core/ws.py
          python -m py_compile hive/core/auth.py
          python -m py_compile hive/core/llm.py
          python -m py_compile hive/core/config.py
          python -m py_compile hive/api/main.py
          echo "All files compile OK"
