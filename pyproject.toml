[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hive"
version = "0.3.0"
description = "Decentralized P2P E2EE multi-agent AI platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Marko Gorny", email = "sockagorny@gmail.com"}]
keywords = ["ai", "agents", "llm", "p2p", "e2ee", "mcp", "decentralized"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pyyaml",
    "requests",
    "aiosqlite",
    "jinja2",
    "bcrypt",
    "websockets",
    "pynacl",
    "zeroconf",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio"]
full = [
    "chromadb",
    "sentence-transformers",
    "mysql-connector-python",
]

[tool.setuptools.packages.find]
include = ["hive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
